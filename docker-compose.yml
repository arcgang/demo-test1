services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vodacom
      POSTGRES_PASSWORD: vodacom_dev
      POSTGRES_DB: vodacom_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodacom -d vodacom_shop"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
